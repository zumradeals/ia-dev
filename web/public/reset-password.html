<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — GamadCode</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0a0a14; --card:#12121f; --border:#1e1e35; --p:#6366f1; --p2:#a855f7; --text:#e2e8f0; --muted:#64748b; --err:#f87171; --ok:#22c55e; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .container { width:100%; max-width:420px; }
  .logo { text-align:center; font-size:28px; font-weight:800; margin-bottom:28px; background:linear-gradient(135deg,var(--p),var(--p2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px; }
  .card-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .card-sub { font-size:13px; color:var(--muted); margin-bottom:24px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; margin-top:18px; }
  label:first-of-type { margin-top:0; }
  input[type=password] { width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:10px; font-size:15px; outline:none; transition:border .2s; }
  input[type=password]:focus { border-color:var(--p); }
  .strength { height:3px; border-radius:2px; margin-top:6px; transition:all .3s; background:var(--border); }
  .btn { width:100%; padding:13px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; border:none; margin-top:20px; background:linear-gradient(135deg,var(--p),var(--p2)); color:#fff; transition:opacity .2s; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .alert { padding:12px 14px; border-radius:10px; font-size:14px; margin-bottom:16px; display:none; }
  .alert.error   { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.3); color:var(--err); }
  .alert.success { background:rgba(34,197,94,.1);    border:1px solid rgba(34,197,94,.3);   color:var(--ok); }
  .back { text-align:center; margin-top:20px; font-size:13px; color:var(--muted); }
  .back a { color:var(--p); text-decoration:none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">GamadCode</div>
  <div class="card">
    <div class="card-title">Nouveau mot de passe</div>
    <div class="card-sub">Choisissez un mot de passe sécurisé pour votre compte.</div>

    <div class="alert" id="alert"></div>

    <div id="form-wrap">
      <label>Nouveau mot de passe</label>
      <input type="password" id="pw" placeholder="8 caractères minimum" oninput="checkStrength(this.value)" autocomplete="new-password">
      <div class="strength" id="strength-bar"></div>

      <label>Confirmer le mot de passe</label>
      <input type="password" id="pw2" placeholder="Répétez le mot de passe" autocomplete="new-password">

      <button class="btn" id="btn" onclick="doReset()">Enregistrer le mot de passe</button>
    </div>

    <div id="success-wrap" style="display:none;text-align:center;padding:16px 0">
      <div style="font-size:40px;margin-bottom:12px">✅</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px">Mot de passe mis à jour !</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</div>
      <a href="/login" style="color:var(--p);font-weight:600">Aller à la connexion →</a>
    </div>
  </div>
  <div class="back"><a href="/login">← Retour à la connexion</a></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) {
  document.getElementById('alert').textContent = 'Lien invalide — demandez un nouveau lien de réinitialisation.';
  document.getElementById('alert').className = 'alert error';
  document.getElementById('alert').style.display = 'block';
  document.getElementById('form-wrap').style.display = 'none';
}

function checkStrength(pw) {
  const bar = document.getElementById('strength-bar');
  if (!pw) { bar.style.width = '0'; bar.style.background = 'var(--border)'; return; }
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['var(--err)', 'var(--err)', '#f59e0b', '#22c55e', '#22c55e'];
  bar.style.width = (score * 20) + '%';
  bar.style.background = colors[score - 1] || 'var(--border)';
}

async function doReset() {
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const alertEl = document.getElementById('alert');
  const btn = document.getElementById('btn');

  alertEl.style.display = 'none';

  if (pw.length < 8) { showAlert('Mot de passe trop court (8 caractères minimum)', 'error'); return; }
  if (pw !== pw2)    { showAlert('Les mots de passe ne correspondent pas', 'error'); return; }

  btn.disabled = true; btn.textContent = 'Enregistrement…';

  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const data = await r.json();
    if (!r.ok) { showAlert(data.error || 'Erreur serveur', 'error'); return; }
    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('success-wrap').style.display = 'block';
  } catch {
    showAlert('Erreur réseau — réessayez', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Enregistrer le mot de passe';
  }
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert ' + type;
  el.style.display = 'block';
}
</script>
</body>
</html>
