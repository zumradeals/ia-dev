<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — GamadCode</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="breadcrumb">Vue d'ensemble du serveur</div>
      </div>
      <button class="btn btn-secondary btn-sm" id="refresh-btn">↻ Rafraîchir</button>
    </div>
    <div class="content">

      <!-- System metrics -->
      <div class="grid grid-3" id="metrics-grid" style="margin-bottom:24px">
        <div class="card" id="card-cpu">
          <div class="card-header"><span class="card-title">CPU</span><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--muted)"><path d="M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z"/></svg></div>
          <div class="card-value" id="cpu-val">—</div>
          <div class="card-sub">utilisation moyenne</div>
          <div class="progress"><div class="progress-bar" id="cpu-bar" style="width:0%"></div></div>
        </div>
        <div class="card" id="card-mem">
          <div class="card-header"><span class="card-title">Mémoire RAM</span><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--muted)"><path d="M4 8h16v8H4V8zm0-2h16c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2zM6 10v4h2v-4H6zm3 0v4h2v-4H9zm3 0v4h2v-4h-2zm3 0v4h2v-4h-2z"/></svg></div>
          <div class="card-value" id="mem-val">—</div>
          <div class="card-sub" id="mem-sub">chargement…</div>
          <div class="progress"><div class="progress-bar" id="mem-bar" style="width:0%"></div></div>
        </div>
        <div class="card" id="card-disk">
          <div class="card-header"><span class="card-title">Disque</span><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--muted)"><path d="M2 16h20v-2H2v2zm0 4h20v-2H2v2zm0-8h20V4H2v8zm2-6h16v4H4V6z"/></svg></div>
          <div class="card-value" id="disk-val">—</div>
          <div class="card-sub" id="disk-sub">chargement…</div>
          <div class="progress"><div class="progress-bar" id="disk-bar" style="width:0%"></div></div>
        </div>
      </div>

      <!-- Quick actions -->
      <div style="margin-bottom:24px;display:flex;gap:10px;flex-wrap:wrap">
        <a href="http://localhost:8080" target="_blank" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
          Ouvrir VS Code
        </a>
        <a href="/logs" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
          Voir les logs
        </a>
        <a href="/modules" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
          Modules
        </a>
      </div>

      <!-- Services status -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Services système</span>
          <span id="services-count" style="font-size:12px;color:var(--muted)"></span>
        </div>
        <table class="table" id="services-table">
          <thead><tr><th>Service</th><th>Statut</th><th>Action</th></tr></thead>
          <tbody id="services-tbody">
            <tr><td colspan="3" style="color:var(--muted);text-align:center;padding:20px">
              <div class="spinner" style="margin:0 auto"></div>
            </td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(async () => {
    const me = await loadUser(u => { window._user = u; renderSidebar('dashboard'); });
    if (!me?.authenticated && document.location.pathname !== '/') {
        window.location.href = '/';
    }

    async function loadMetrics() {
        try {
            const s = await API.get('/api/system');
            document.getElementById('cpu-val').textContent  = s.cpu.load + '%';
            document.getElementById('mem-val').textContent  = s.mem.pct + '%';
            document.getElementById('mem-sub').textContent  = fmt(s.mem.used) + ' / ' + fmt(s.mem.total);
            document.getElementById('disk-val').textContent = s.disk.pct + '%';
            document.getElementById('disk-sub').textContent = fmt(s.disk.used) + ' / ' + fmt(s.disk.total);
            renderProgress(document.getElementById('cpu-bar'),  s.cpu.load);
            renderProgress(document.getElementById('mem-bar'),  s.mem.pct);
            renderProgress(document.getElementById('disk-bar'), s.disk.pct);
        } catch(e) {
            console.error(e);
        }
    }

    async function loadServices() {
        try {
            const svcs = await API.get('/api/services');
            const active = svcs.filter(s => s.status === 'active').length;
            document.getElementById('services-count').textContent = active + '/' + svcs.length + ' actifs';
            document.getElementById('services-tbody').innerHTML = svcs.map(s => `
                <tr>
                  <td><strong>${s.name}</strong></td>
                  <td><span class="badge ${s.status}">${s.status === 'active' ? 'Actif' : 'Inactif'}</span></td>
                  <td>
                    ${s.status !== 'active'
                        ? `<button class="btn btn-secondary btn-sm" onclick="restart('${s.name}')">▷ Démarrer</button>`
                        : `<button class="btn btn-secondary btn-sm" onclick="restart('${s.name}')">↻ Redémarrer</button>`}
                  </td>
                </tr>`).join('');
        } catch(e) {
            document.getElementById('services-tbody').innerHTML = `<tr><td colspan="3" style="color:var(--red)">${e.message}</td></tr>`;
        }
    }

    window.restart = async (name) => {
        try {
            await API.post('/api/run', { command: 'systemctl', args: ['restart', name] });
            await loadServices();
        } catch(e) { alert(e.message); }
    };

    await Promise.all([loadMetrics(), loadServices()]);
    document.getElementById('refresh-btn').addEventListener('click', () => {
        Promise.all([loadMetrics(), loadServices()]);
    });
    setInterval(loadMetrics, 10000);
})();
</script>
</body>
</html>
