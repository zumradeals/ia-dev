<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé — GamadCode</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #06060f; color: #e2e8f0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #0d0d1c; border: 1px solid #1a1a32; border-radius: 20px;
    padding: 56px 48px; max-width: 480px; width: 100%; text-align: center;
  }
  .icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(248,113,113,.1); border: 2px solid rgba(248,113,113,.3);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px; font-size: 32px;
  }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; letter-spacing: -.5px; }
  p  { color: #64748b; font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: #7c3aed; color: #fff; padding: 13px 24px;
    border-radius: 10px; font-size: 15px; font-weight: 700;
    text-decoration: none; transition: background .2s;
  }
  .btn-primary:hover { background: #a855f7; }
  .btn-ghost {
    border: 1px solid #1a1a32; color: #94a3b8; padding: 13px 24px;
    border-radius: 10px; font-size: 15px; font-weight: 600;
    text-decoration: none; transition: border-color .2s;
  }
  .btn-ghost:hover { border-color: #7c3aed; color: #c4b5fd; }
  .footer-note { font-size: 12px; color: #475569; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✕</div>
  <h1>Paiement non complété</h1>
  <p>Votre paiement a été annulé ou a échoué.<br>
  Aucun montant n'a été débité. Vous pouvez réessayer à tout moment.</p>
  <div class="btns">
    <a href="/my" class="btn-primary">Réessayer →</a>
    <a href="/my" class="btn-ghost">Retour</a>
  </div>
  <p class="footer-note">Besoin d'aide ? Contactez-nous : contact@gamad.net</p>
</div>
</body>
</html>
