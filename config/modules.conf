# ─────────────────────────────────────────────
# DevLab — Activation des modules
# true  = installé lors de 'devlab install all'
# false = ignoré (installable manuellement)
# ─────────────────────────────────────────────

# ── Base système ─────────────────────────────
MODULE_BASE_SYSTEM_TOOLS=true

# ── Langages ─────────────────────────────────
MODULE_LANGUAGES_NODEJS=true
MODULE_LANGUAGES_PYTHON=true
MODULE_LANGUAGES_PHP=true
MODULE_LANGUAGES_GOLANG=true
MODULE_LANGUAGES_RUST=false      # lourd, désactivé par défaut

# ── Conteneurisation ──────────────────────────
MODULE_CONTAINERS_DOCKER=true
MODULE_CONTAINERS_COMPOSE=true

# ── Bases de données ──────────────────────────
MODULE_DATABASES_POSTGRESQL=true
MODULE_DATABASES_MARIADB=false   # désactivé si PostgreSQL suffit
MODULE_DATABASES_REDIS=true

# ── Web ───────────────────────────────────────
MODULE_WEB_NGINX=true

# ── Outils IA ─────────────────────────────────
MODULE_AI_CLAUDE_CODE=true
MODULE_AI_OPENAI_CODEX=false     # optionnel

# ── Outils développement ──────────────────────
MODULE_DEVTOOLS_ZSH=true
MODULE_DEVTOOLS_TMUX=true
MODULE_DEVTOOLS_FZF=true
MODULE_DEVTOOLS_MODERN_CLI=true  # ripgrep, bat, eza
MODULE_DEVTOOLS_CODE_SERVER=false  # VS Code in browser, lourd

# ── Tests ─────────────────────────────────────
MODULE_TESTING_PLAYWRIGHT=false  # requiert navigateurs (~600MB)
MODULE_TESTING_VITEST_JEST=true
MODULE_TESTING_PYTEST=true
MODULE_TESTING_PHPUNIT=false     # activé si PHP activé
