name: Build workspace image

on:
  push:
    branches: [main]
    paths:
      - 'docker/workspace-image/Dockerfile'
      - 'scripts/workspace-startup.sh'
      - 'config/workspace-extensions.conf'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de l image (ex: v1.0.0). Laissez vide pour latest.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE="gamad/gamadcode-workspace"
          TAGS="${IMAGE}:latest"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Building: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/workspace-image
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=GamadCode Studio
            org.opencontainers.image.description=GamadCode developer workspace
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Verify branding
        run: |
          docker pull gamad/gamadcode-workspace:latest
          NAME=$(docker run --rm gamad/gamadcode-workspace:latest \
            sh -c 'cat "$OPENVSCODE_SERVER_ROOT/product.json"' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['nameShort'])")
          echo "nameShort = $NAME"
          [ "$NAME" = "GamadCode Studio" ] || (echo "ERREUR: branding non appliqué" && exit 1)
