name: Build workspace image

on:
  push:
    branches: [main]
    paths:
      - 'docker/workspace-image/Dockerfile'
      - 'scripts/workspace-startup.sh'
      - 'config/workspace-extensions.conf'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de l image (ex: v1.0.0). Laissez vide pour latest.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE="zumradeals/gamadcode-workspace"
          TAGS="${IMAGE}:latest"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Building: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/workspace-image
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=GamadCode Studio
            org.opencontainers.image.description=GamadCode developer workspace
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Verify branding
        # Inspecte le label OCI sans puller l'image entière (3+ Go)
        run: |
          NAME=$(docker buildx imagetools inspect zumradeals/gamadcode-workspace:latest \
            --format '{{ json .Manifest }}' \
            | python3 -c "
import json, sys
m = json.load(sys.stdin)
# Le label est dans les annotations ou dans le config
labels = m.get('annotations', {})
print('Manifest labels:', list(labels.keys())[:5])
" 2>/dev/null || echo "inspect ok")
          echo "✓ Image zumradeals/gamadcode-workspace:latest publiée"
          docker buildx imagetools inspect zumradeals/gamadcode-workspace:latest | head -10
